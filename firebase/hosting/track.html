<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>ZaKi — Пайгирии расонанда</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #header {
      background: #16213e;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #header .logo {
      font-size: 22px;
      font-weight: 800;
      color: #f39c12;
      letter-spacing: 1px;
    }
    #header .title {
      font-size: 13px;
      opacity: 0.75;
    }

    #info-bar {
      background: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e8e8e8;
      flex-shrink: 0;
      min-height: 48px;
    }
    .pulse-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #27ae60;
      flex-shrink: 0;
      animation: blink 1.8s ease-in-out infinite;
    }
    .pulse-dot.inactive {
      background: #bdc3c7;
      animation: none;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.85); }
    }
    #courier-label {
      font-size: 14px;
      font-weight: 600;
      color: #2c3e50;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status-label {
      font-size: 12px;
      color: #7f8c8d;
      white-space: nowrap;
    }

    /* Live map */
    #map {
      flex: 1;
      width: 100%;
      display: none;
    }

    /* Generic centered overlay (loading, error, done) */
    #overlay {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #7f8c8d;
      padding: 24px;
      text-align: center;
    }
    #overlay .icon { font-size: 56px; }
    #overlay .msg  { font-size: 17px; color: #2c3e50; font-weight: 600; }
    #overlay .sub  { font-size: 14px; color: #95a5a6; line-height: 1.5; }
  </style>
</head>
<body>

  <div id="header">
    <span class="logo">ZaKi</span>
    <span class="title">Пайгирии расонанда · Отслеживание курьера</span>
  </div>

  <div id="info-bar">
    <div class="pulse-dot" id="pulse-dot"></div>
    <span id="courier-label">Зеро меорем…</span>
    <span id="status-label"></span>
  </div>

  <!-- centered overlay: loading / error / completed -->
  <div id="overlay">
    <div class="icon">📦</div>
    <div class="msg" id="overlay-msg">Зеро меорем…</div>
    <div class="sub" id="overlay-sub">Лутфан интизор шавед</div>
  </div>

  <!-- live map (shown only while IN_PROGRESS) -->
  <div id="map"></div>

  <script type="module">
    import { initializeApp }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, doc, getDoc, onSnapshot }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // ── Firebase ─────────────────────────────────────────────────────────────
    const app = initializeApp({
      apiKey:            'AIzaSyCPRo5_sfkPMOIDdAP1MWFCSLbCO7HqHA0',
      authDomain:        'auva-70253.firebaseapp.com',
      projectId:         'auva-70253',
      storageBucket:     'auva-70253.firebasestorage.app',
      messagingSenderId: '286896671827',
      appId:             '1:286896671827:android:8ef70dcf8e82063cdc0aa6',
    });
    const db = getFirestore(app);

    // ── DOM ───────────────────────────────────────────────────────────────────
    const $overlay    = document.getElementById('overlay');
    const $overlayMsg = document.getElementById('overlay-msg');
    const $overlaySub = document.getElementById('overlay-sub');
    const $map        = document.getElementById('map');
    const $dot        = document.getElementById('pulse-dot');
    const $courierLbl = document.getElementById('courier-label');
    const $statusLbl  = document.getElementById('status-label');

    // ── URL param ─────────────────────────────────────────────────────────────
    const deliveryId = new URLSearchParams(window.location.search).get('d');
    if (!deliveryId) {
      showScreen('error', '⚠️', 'Ҳавола нодуруст аст', 'Аз курьер ҳавола нав хоҳиш кунед');
      throw new Error('missing delivery id');
    }

    // ── Google Maps ───────────────────────────────────────────────────────────
    let gMap     = null;
    let gMarker  = null;
    let mapReady = false;

    // Resolved once Maps JS API fires its callback
    const mapsLoaded = new Promise(res => { window._mapsReady = res; });

    function initMap(lat, lng, label) {
      $overlay.style.display = 'none';
      $map.style.display = 'block';

      gMap = new google.maps.Map($map, {
        center: { lat, lng },
        zoom: 15,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });
      gMarker = new google.maps.Marker({
        position: { lat, lng },
        map: gMap,
        title: label,
        animation: google.maps.Animation.DROP,
        icon: {
          url: 'https://maps.google.com/mapfiles/ms/icons/motorcycling.png',
          scaledSize: new google.maps.Size(40, 40),
        },
      });
      mapReady = true;
    }

    function moveMarker(lat, lng) {
      if (!mapReady) return;
      gMarker.setPosition({ lat, lng });
      gMap.panTo({ lat, lng });
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    /** Hide map, show the centered overlay with given content. */
    function showScreen(type, icon, msg, sub) {
      $map.style.display     = 'none';
      $overlay.style.display = 'flex';
      document.querySelector('#overlay .icon').textContent = icon;
      $overlayMsg.textContent = msg;
      $overlaySub.textContent = sub;
      $dot.classList.add('inactive');

      if (type === 'done-ok') {
        $dot.style.background = '#27ae60';
        $statusLbl.textContent = 'Расонида шуд';
      } else if (type === 'done-cancel') {
        $statusLbl.textContent = 'Бекор карда шуд';
      } else {
        $statusLbl.textContent = '';
      }
    }

    /** Determine if the delivery status means "finished" and which kind. */
    function isFinished(status) {
      return status && status !== 'IN_PROGRESS';
    }
    function isCancelled(status) {
      return status === 'CANCELLED';
    }

    /** Stop tracking and show the appropriate end-screen. */
    function stopTracking(status, unsubscribeCourier) {
      // Kill the courier location listener immediately
      if (typeof unsubscribeCourier === 'function') unsubscribeCourier();

      if (isCancelled(status)) {
        showScreen('done-cancel', '❌', 'Фармоиш бекор карда шуд',
          'Расонанда фармоишро бекор кард · Заказ отменён');
      } else {
        showScreen('done-ok', '✅', 'Расонида шуд!',
          'Расонанда фармоишро иҷро кард · Доставка завершена');
      }
    }

    // ── Main ──────────────────────────────────────────────────────────────────
    async function run() {
      // 1. Fetch the delivery document once
      let deliverySnap;
      try {
        deliverySnap = await getDoc(doc(db, 'deliveries', deliveryId));
      } catch {
        showScreen('error', '📡', 'Интернет пайваст нест',
          'Пайвастиро санҷед ва саҳифаро аз нав боркунед');
        return;
      }

      if (!deliverySnap.exists()) {
        showScreen('error', '🔍', 'Фармоиш ёфт нашуд',
          'Ҳавола кӯҳна ё нодуруст аст');
        return;
      }

      const delivery  = deliverySnap.data();
      const courierId = delivery.courierId;

      // 2. Fetch courier info (name / phone)
      let courierName  = 'Курьер';
      let courierPhone = '';
      try {
        const cs = await getDoc(doc(db, 'users', courierId));
        if (cs.exists()) {
          courierName  = cs.data().name  || 'Курьер';
          courierPhone = cs.data().phone || '';
        }
      } catch { /* non-critical */ }

      $courierLbl.textContent = courierName + (courierPhone ? ` · ${courierPhone}` : '');

      // 3. If the delivery is already finished — show end screen, no map.
      if (isFinished(delivery.status)) {
        stopTracking(delivery.status, null);
        return;
      }

      // ── Delivery is IN_PROGRESS — start live tracking ──

      $statusLbl.textContent = 'Онлайн';

      // Wait for Google Maps JS to load
      await mapsLoaded;

      // unsubscribeCourier will be set once the listener starts
      let unsubscribeCourier = null;
      let firstLocation = true;

      // 4. Real-time courier location
      unsubscribeCourier = onSnapshot(doc(db, 'users', courierId), (snap) => {
        if (!snap.exists()) return;
        const loc = snap.data().lastLocation;
        if (!loc || typeof loc.latitude !== 'number') {
          if (firstLocation) {
            $overlayMsg.textContent = 'Курьер ҳанӯз мавқеъро нафиристодааст…';
            $overlaySub.textContent = 'Лутфан интизор шавед';
          }
          return;
        }

        const lat = loc.latitude;
        const lng = loc.longitude;

        if (firstLocation) {
          firstLocation = false;
          initMap(lat, lng, courierName);
        } else {
          moveMarker(lat, lng);
        }
      });

      // 5. Real-time delivery status — stop everything when done/cancelled
      onSnapshot(doc(db, 'deliveries', deliveryId), (snap) => {
        if (!snap.exists()) return;
        const status = snap.data().status;
        if (isFinished(status)) {
          stopTracking(status, unsubscribeCourier);
          // unsubscribeCourier is now invalid; null it to prevent double-call
          unsubscribeCourier = null;
        }
      });
    }

    run();
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAk3WuUNwz0PNu73HAFPW7knrzPmxrjXzo&callback=_mapsReady&loading=async">
  </script>

</body>
</html>

<body>

  <div id="header">
    <span class="logo">ZaKi</span>
    <span class="title">Пайгирии расонанда · Отслеживание курьера</span>
  </div>

  <div id="info-bar">
    <div class="pulse-dot" id="pulse-dot"></div>
    <span id="courier-label">Зеро меорем…</span>
    <span id="status-label" id="status-label"></span>
  </div>

  <!-- shown while loading / on error -->
  <div id="overlay">
    <div class="icon">📦</div>
    <div class="msg" id="overlay-msg">Зеро меорем…</div>
    <div class="sub"  id="overlay-sub">Лутфан интизор шавед</div>
  </div>

  <!-- map fills the rest once ready -->
  <div id="map" style="display:none; position:relative;">
    <div id="done-overlay">✅ Расонида шуд · Доставка завершена</div>
  </div>

  <!-- Firebase SDK (modular ESM CDN) -->
  <script type="module">
    import { initializeApp }           from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, doc, getDoc, onSnapshot }
                                       from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // ─── Firebase config ────────────────────────────────────────────────────
    const app = initializeApp({
      apiKey:            "AIzaSyCPRo5_sfkPMOIDdAP1MWFCSLbCO7HqHA0",
      authDomain:        "auva-70253.firebaseapp.com",
      projectId:         "auva-70253",
      storageBucket:     "auva-70253.firebasestorage.app",
      messagingSenderId: "286896671827",
      appId:             "1:286896671827:android:8ef70dcf8e82063cdc0aa6",
    });
    const db = getFirestore(app);

    // ─── DOM refs ────────────────────────────────────────────────────────────
    const $overlay     = document.getElementById('overlay');
    const $overlayMsg  = document.getElementById('overlay-msg');
    const $overlaySub  = document.getElementById('overlay-sub');
    const $map         = document.getElementById('map');
    const $doneOverlay = document.getElementById('done-overlay');
    const $dot         = document.getElementById('pulse-dot');
    const $courierLbl  = document.getElementById('courier-label');
    const $statusLbl   = document.getElementById('status-label');

    // ─── URL param: ?d=DELIVERY_ID ───────────────────────────────────────────
    const deliveryId = new URLSearchParams(window.location.search).get('d');
    if (!deliveryId) {
      $overlayMsg.textContent = 'Ҳавола нодуруст аст';
      $overlaySub.textContent = 'Аз курьер ҳавола нав хоҳиш кунед';
      throw new Error('no delivery id');
    }

    // ─── Google Maps state ────────────────────────────────────────────────────
    let gMap    = null;
    let gMarker = null;
    let mapReady = false;

    // Promise resolved when the Maps JS API callback fires
    const mapsLoaded = new Promise(res => { window._mapsReady = res; });

    function showMap() {
      $overlay.style.display = 'none';
      $map.style.display     = 'block';
    }

    function initMap(lat, lng, label) {
      showMap();
      gMap = new google.maps.Map($map, {
        center: { lat, lng },
        zoom: 15,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });
      gMarker = new google.maps.Marker({
        position: { lat, lng },
        map: gMap,
        title: label,
        animation: google.maps.Animation.DROP,
        icon: {
          url: 'https://maps.google.com/mapfiles/ms/icons/motorcycling.png',
          scaledSize: new google.maps.Size(40, 40),
        },
      });
      mapReady = true;
    }

    function moveMarker(lat, lng) {
      if (!mapReady) return;
      const pos = { lat, lng };
      gMarker.setPosition(pos);
      gMap.panTo(pos);
    }

    function setDeliveryDone() {
      $dot.classList.add('inactive');
      $statusLbl.textContent = 'Расонида шуд';
      if ($doneOverlay) $doneOverlay.style.display = 'block';
    }

    // ─── Main logic ───────────────────────────────────────────────────────────
    async function run() {
      // 1. Fetch delivery document
      let deliverySnap;
      try {
        deliverySnap = await getDoc(doc(db, 'deliveries', deliveryId));
      } catch (e) {
        $overlayMsg.textContent = 'Интернет пайваст нест';
        $overlaySub.textContent = 'Пайвастиро санҷед ва аз нав кӯшиш кунед';
        return;
      }

      if (!deliverySnap.exists()) {
        $overlayMsg.textContent = 'Фармоиш ёфт нашуд';
        $overlaySub.textContent = 'Ҳавола метавонад мӯҳлати гузаштаи он бошад';
        return;
      }

      const delivery  = deliverySnap.data();
      const courierId = delivery.courierId;
      const isDone    = delivery.status !== 'IN_PROGRESS';

      // 2. Fetch courier name / phone
      let courierName  = 'Курьер';
      let courierPhone = '';
      try {
        const courierSnap = await getDoc(doc(db, 'users', courierId));
        if (courierSnap.exists()) {
          const cd = courierSnap.data();
          courierName  = cd.name  || 'Курьер';
          courierPhone = cd.phone || '';
        }
      } catch (_) { /* non-critical */ }

      $courierLbl.textContent = courierName + (courierPhone ? ` · ${courierPhone}` : '');

      if (isDone) {
        setDeliveryDone();
        $statusLbl.textContent = 'Расонида шуд';
        $overlayMsg.textContent = '✅ Расонида шуд!';
        $overlaySub.textContent = 'Расонанда фармоишро иҷро кард.';
        // Still try to show last known location
      } else {
        $statusLbl.textContent = 'Онлайн';
      }

      // 3. Wait for Google Maps to be ready
      await mapsLoaded;

      // 4. Subscribe to real-time courier location
      let firstUpdate = true;
      onSnapshot(doc(db, 'users', courierId), (snap) => {
        if (!snap.exists()) return;
        const loc = snap.data().lastLocation;
        if (!loc || typeof loc.latitude !== 'number') {
          if (firstUpdate) {
            $overlayMsg.textContent = 'Интизор шавед…';
            $overlaySub.textContent = 'Курьер ҳанӯз мавқеъро нафиристодааст';
          }
          return;
        }

        const lat = loc.latitude;
        const lng = loc.longitude;

        if (firstUpdate) {
          firstUpdate = false;
          initMap(lat, lng, courierName);
          if (isDone) {
            setDeliveryDone();
            $doneOverlay.style.display = 'block';
          }
        } else {
          moveMarker(lat, lng);
        }
      });

      // 5. Also listen for delivery status changes (e.g. courier completes while client watches)
      onSnapshot(doc(db, 'deliveries', deliveryId), (snap) => {
        if (!snap.exists()) return;
        const d = snap.data();
        if (d.status !== 'IN_PROGRESS') {
          setDeliveryDone();
        }
      });
    }

    run();
  </script>

  <!-- Google Maps JavaScript API -->
  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAk3WuUNwz0PNu73HAFPW7knrzPmxrjXzo&callback=_mapsReady&loading=async"
  ></script>

</body>
